<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracking App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Finance Tracking App</h1>

    <!-- Student Registration -->
    <form id="registration-form">
      <input type="text" id="student-name" placeholder="Student Name" required>
      <select id="tier-select" required>
        <option value="">Select Tier</option>
        <option value="1">Tier 1 - 10,000 Naira (5% per week)</option>
        <option value="2">Tier 2 - 20,000 Naira (10% per week)</option>
        <option value="3">Tier 3 - 30,000 Naira (20% per week)</option>
      </select>
      <button type="submit">Join Group</button>
    </form>

    <!-- Finance Dashboard -->
    <h2>Finance Dashboard</h2>
    <p>Total Savings: <span id="total-savings">0</span> Naira</p>
    <ul id="student-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
